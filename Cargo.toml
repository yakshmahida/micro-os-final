[package]
name = "micro_os"
version = "0.1.0"
edition = "2021"
authors = ["Yakshendrasinh R Mahida <25BTRCL288@example.com>"]
description = "Titanium Micro-OS: CS2001 OS Capstone mechanisms library and demo"

[lib]
name = "micro_os"
path = "src/lib.rs"

[[bin]]
name = "micro-os-demo"
path = "src/main.rs"

[dependencies]

[build-dependencies]
kernel = { package = "micro-os-kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[workspace]
members = [
    ".",
    "kernel",
]
default-members = ["."]
